<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smoked Satin OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500&family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #08080a;
            --satin-sheen: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.02) 100%);
            --smoked-glass: rgba(15, 15, 18, 0.6);
            --accent-glow: rgba(140, 150, 255, 0.15);
            --text-main: #e0e0e6;
            --text-dim: rgba(224, 224, 230, 0.5);
            --radius-lg: 28px;
            --radius-md: 18px;
            --font-main: 'Montserrat', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-deep);
            font-family: var(--font-main);
            color: var(--text-main);
        }

        /* Desktop Canvas */
        .desktop {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: radial-gradient(circle at 50% 50%, #121217 0%, #08080a 100%);
        }

        /* Wallpaper Component: Smoked Satin Curvature */
        .wallpaper-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            pointer-events: none;
        }

        .satin-circle {
            width: 45vh;
            height: 45vh;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: radial-gradient(circle at 30% 30%, rgba(60, 60, 80, 0.4) 0%, rgba(20, 20, 25, 0.8) 100%);
            position: relative;
            box-shadow: 0 0 80px var(--accent-glow);
            overflow: hidden;
        }

        .satin-circle::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: var(--satin-sheen);
            transform: rotate(-15deg);
        }

        /* Top Bar */
        .top-bar {
            position: fixed;
            top: 0;
            width: 100%;
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            background: transparent;
            backdrop-filter: blur(10px);
            z-index: 100;
            font-size: 13px;
            font-weight: 500;
        }

        .top-bar-left, .top-bar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .menu-item {
            cursor: pointer;
            color: var(--text-main);
            letter-spacing: 0.5px;
            transition: opacity 0.2s ease;
        }

        .menu-item:hover {
            opacity: 0.7;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 16px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-dim);
        }

        .status-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Minimalist Large Clock */
        .hero-clock {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-top: 15vh;
            animation: fadeIn 1.2s ease-out;
        }

        .hero-clock .time {
            font-size: 110px;
            font-weight: 200;
            letter-spacing: -4px;
            color: var(--text-main);
            line-height: 1;
            margin-bottom: 8px;
        }

        .hero-clock .date {
            font-family: var(--font-mono);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: var(--text-dim);
        }

        /* Smoked Dock */
        .dock-container {
            margin-bottom: 24px;
            z-index: 100;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dock {
            background: var(--smoked-glass);
            backdrop-filter: blur(30px) saturate(150%);
            padding: 10px;
            border-radius: var(--radius-lg);
            display: flex;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .dock-item {
            width: 54px;
            height: 54px;
            background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            border-radius: var(--radius-md);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease;
            position: relative;
        }

        .dock-item:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.1);
        }

        .dock-item svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-main);
            stroke-width: 1.5;
            fill: none;
        }

        /* Utilities */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dot {
            width: 4px;
            height: 4px;
            background: var(--text-dim);
            border-radius: 50%;
            margin-top: 4px;
            position: absolute;
            bottom: -10px;
        }

    </style>
</head>
<body>

    <div class="desktop">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="top-bar-left">
                <span class="menu-item" style="font-weight: 700;">●</span>
                <span class="menu-item">Finder</span>
                <span class="menu-item">File</span>
                <span class="menu-item">Edit</span>
                <span class="menu-item">View</span>
                <span class="menu-item">Window</span>
            </div>
            <div class="top-bar-right">
                <div class="system-status">
                    <svg class="status-icon" viewBox="0 0 24 24"><path d="M12 20c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8m0-18C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2z" fill="currentColor" opacity=".3"/><path d="M12 4c-4.41 0-8 3.59-8 8s3.59 8 8 8 8-3.59 8-8-3.59-8-8-8zm0 14c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z" fill="currentColor"/></svg>
                    <span>88%</span>
                    <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
                    <span id="top-clock">12:00 PM</span>
                </div>
            </div>
        </header>

        <!-- Wallpaper -->
        <div class="wallpaper-container">
            <div class="satin-circle"></div>
        </div>

        <!-- Main Content -->
        <div class="hero-clock">
            <div class="time" id="main-clock">00:00</div>
            <div class="date" id="main-date">MONDAY, OCTOBER 24</div>
        </div>

        <!-- Dock -->
        <div class="dock-container">
            <nav class="dock">
                <div class="dock-item">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    <div class="dot"></div>
                </div>
                <div class="dock-item">
                    <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                </div>
                <div class="dock-item">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
                </div>
                <div class="dock-item">
                    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    <div class="dot"></div>
                </div>
                <div class="dock-item">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path></svg>
                </div>
                <div class="dock-item" style="border-left: 1px solid rgba(255,255,255,0.1); margin-left: 8px; padding-left: 20px; width: 62px;">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </div>
            </nav>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            
            // Format Top Clock
            const topTimeStr = now.toLocaleTimeString('en-US', { 
                hour: 'numeric', 
                minute: '2-digit', 
                hour12: true 
            });
            document.getElementById('top-clock').textContent = topTimeStr;

            // Format Hero Clock
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('main-clock').textContent = `${hours}:${minutes}`;

            // Format Date
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('main-date').textContent = now.toLocaleDateString('en-US', options);
        }

        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
